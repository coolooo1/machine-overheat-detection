name: C build and tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Windows UCRT64 GCC
        uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Compile with warnings as errors and run all tests
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $env:PATH = "$env:MSYS2_LOCATION\ucrt64\bin;$env:PATH"
          $compiler = Join-Path $env:MSYS2_LOCATION 'ucrt64\bin\gcc.exe'
          & .\scripts\build.ps1 -Compiler $compiler -Test
